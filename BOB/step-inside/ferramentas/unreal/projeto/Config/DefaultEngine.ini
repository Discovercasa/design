; Step Inside Phase 4 on the home station (RTX 2060 6 GB): Lumen with hardware ray tracing (task 69, 2026-11-24: software
; Lumen leaked light through the thin plasterboard walls), virtual shadow maps, DX12 SM6, TSR.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.RayTracing.Shadows=False
r.SkinCache.CompileShaders=True
r.PathTracing=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; SM6 is what turns ray tracing on (with SM5 only the RHI reports it unsupported and Lumen falls back to software)
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Visita/TV_Visita.TV_Visita
GameDefaultMap=/Game/Visita/TV_Visita.TV_Visita

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bDeveloperMode=True

; caches on D: (the home station's C: has little space): Zen DDC data here; the runner also sets UE-LocalDataCachePath
[Zen.AutoLaunch]
DataPath=D:/BOB-posto/unreal/DDC/Zen
