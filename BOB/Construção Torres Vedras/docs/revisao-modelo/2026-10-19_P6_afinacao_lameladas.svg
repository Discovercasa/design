<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Topo das paredes debaixo das lameladas (cotas do D2503, escala 1:2,5 na vertical)</text>

  <!-- scale: z (m) -> y px ; y = 560 - (z - 2.40) * 1000 * 0.9 -->
  <!-- LEFT: interior wall -->
  <text x="250" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Parede interior (módulo 2,53)</text>
  <!-- lamelada 2.653-2.853 -->
  <rect x="80" y="155" width="340" height="180" fill="#7C86C8" stroke="#3b4170"/>
  <text x="250" y="250" text-anchor="middle" font-size="15" fill="#fff">Lamelada 20×10 (2,653 – 2,853)</text>
  <!-- gap 2.64-2.653 -->
  <rect x="215" y="335" width="70" height="12" fill="#ffe08a" stroke="#c99a00" stroke-dasharray="3 2"/>
  <!-- afinação 2.53-2.64 -->
  <rect x="215" y="347" width="70" height="99" fill="#E2604A" stroke="#8a2f22"/>
  <text x="250" y="402" text-anchor="middle" font-size="12" fill="#fff">afinação</text>
  <text x="250" y="416" text-anchor="middle" font-size="12" fill="#fff">11×7,5</text>
  <!-- module 75 frame -->
  <rect x="216" y="446" width="68" height="114" fill="#B9DDA0" stroke="#5c7a48"/>
  <text x="250" y="510" text-anchor="middle" font-size="12" fill="#2f4024">módulo 7,5</text>
  <!-- ceiling 2.50 -->
  <line x1="80" y1="470" x2="214" y2="470" stroke="#999" stroke-width="5"/>
  <line x1="286" y1="470" x2="420" y2="470" stroke="#999" stroke-width="5"/>
  <text x="120" y="490" font-size="12" fill="#666">teto 2,50</text>
  <!-- dims -->
  <g font-size="13" fill="#222">
    <line x1="300" y1="446" x2="350" y2="446" stroke="#222"/><text x="355" y="450">2,53 topo do módulo</text>
    <line x1="300" y1="347" x2="350" y2="347" stroke="#222"/><text x="355" y="351">2,64</text>
    <line x1="300" y1="335" x2="350" y2="335" stroke="#222"/><text x="355" y="331">2,653</text>
  </g>
  <rect x="70" y="560" width="360" height="40" fill="#fff5d6" stroke="#c99a00"/>
  <text x="250" y="578" text-anchor="middle" font-size="13" fill="#7a5a00">entre 2,53 e 2,653 há 12,3 cm; uma afinação 11×7,5 só dá 11 cm</text>
  <text x="250" y="594" text-anchor="middle" font-size="13" fill="#7a5a00">e sobra 1,3 cm (amarelo) — o que põem aqui? um calço?</text>

  <!-- RIGHT: exterior wall -->
  <text x="750" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Parede exterior (módulo 3,50, inteiro)</text>
  <rect x="580" y="155" width="270" height="180" fill="#7C86C8" stroke="#3b4170"/>
  <text x="715" y="250" text-anchor="middle" font-size="15" fill="#fff">Lamelada (2,653 – 2,853)</text>
  <!-- exterior module 110 continuous -->
  <rect x="850" y="90" width="99" height="470" fill="#EDCF9E" stroke="#9c7f4c"/>
  <text x="899" y="520" text-anchor="middle" font-size="12" fill="#5a4520">módulo 11</text>
  <!-- amarração 2.543-2.653 on inner face -->
  <rect x="782" y="335" width="68" height="99" fill="#E2604A" stroke="#8a2f22"/>
  <text x="816" y="380" text-anchor="middle" font-size="11" fill="#fff">amarração</text>
  <text x="816" y="394" text-anchor="middle" font-size="11" fill="#fff">11×7,5</text>
  <line x1="580" y1="470" x2="849" y2="470" stroke="#999" stroke-width="5"/>
  <text x="600" y="490" font-size="12" fill="#666">teto 2,50</text>
  <g font-size="13" fill="#222">
    <line x1="700" y1="434" x2="780" y2="434" stroke="#222"/><text x="600" y="438">2,543</text>
    <line x1="700" y1="335" x2="780" y2="335" stroke="#222"/><text x="600" y="331">2,653</text>
  </g>
  <rect x="570" y="560" width="390" height="40" fill="#eef7ee" stroke="#5c7a48"/>
  <text x="765" y="578" text-anchor="middle" font-size="13" fill="#2f4024">aqui a lamelada assenta na amarração (sem folga)</text>
  <text x="765" y="594" text-anchor="middle" font-size="13" fill="#2f4024">e entra no módulo pelo entalhe</text>
</svg>
