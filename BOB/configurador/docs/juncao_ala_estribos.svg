<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1560" viewBox="0 0 900 1560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="1560" fill="#ffffff"/>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#222">Onde a ala abre para o corpo: em que apoiam as vigas do teto?</text>
  <text x="40" y="82" font-size="17" fill="#555">Exemplo: casa em L (corpo 12 × 8 m, ala 5 × 6 m). Esquema, sem escala nas peças.</text>

  <!-- ===== 1. plan ===== -->
  <text x="40" y="130" font-size="20" font-weight="700" fill="#222">1. Planta (vista de cima, ao nível das vigas do teto)</text>
  <!-- body beams N-S (x 0.29 .. 11.71 every ~0.6) -->
  <g fill="#c99a62">
    <rect x="131.2" y="211" width="3.4" height="338"/><rect x="158.2" y="211" width="3.4" height="338"/>
    <rect x="185.2" y="211" width="3.4" height="338"/><rect x="212.2" y="211" width="3.4" height="338"/>
    <rect x="239.2" y="211" width="3.4" height="338"/><rect x="266.2" y="211" width="3.4" height="338"/>
    <rect x="293.2" y="211" width="3.4" height="338"/><rect x="320.2" y="211" width="3.4" height="338"/>
    <rect x="347.2" y="211" width="3.4" height="338"/><rect x="374.2" y="211" width="3.4" height="338"/>
    <rect x="401.2" y="211" width="3.4" height="338"/><rect x="428.2" y="211" width="3.4" height="338"/>
    <!-- over the opening: they end at the header -->
    <rect x="455.2" y="211" width="3.4" height="342"/><rect x="482.2" y="211" width="3.4" height="342"/>
    <rect x="509.2" y="211" width="3.4" height="342"/><rect x="536.2" y="211" width="3.4" height="342"/>
    <rect x="563.2" y="211" width="3.4" height="342"/><rect x="590.2" y="211" width="3.4" height="342"/>
    <rect x="617.2" y="211" width="3.4" height="342"/><rect x="644.2" y="211" width="3.4" height="342"/>
  </g>
  <!-- wing beams E-W -->
  <g fill="#c99a62">
    <rect x="446" y="573" width="203" height="3.4"/><rect x="446" y="600" width="203" height="3.4"/>
    <rect x="446" y="627" width="203" height="3.4"/><rect x="446" y="654" width="203" height="3.4"/>
    <rect x="446" y="681" width="203" height="3.4"/><rect x="446" y="708" width="203" height="3.4"/>
    <rect x="446" y="735" width="203" height="3.4"/><rect x="446" y="762" width="203" height="3.4"/>
    <rect x="446" y="789" width="203" height="3.4"/>
  </g>
  <!-- walls -->
  <g fill="#555">
    <rect x="120" y="200" width="540" height="11"/>
    <rect x="120" y="200" width="11" height="360"/>
    <rect x="649" y="200" width="11" height="630"/>
    <rect x="120" y="549" width="326" height="11"/>
    <rect x="435" y="549" width="11" height="281"/>
    <rect x="435" y="819" width="225" height="11"/>
  </g>
  <!-- the opening: no wall; the header along it -->
  <rect x="446" y="551" width="203" height="9" fill="#e67e00"/>
  <!-- hangers at the beam ends -->
  <g fill="#1d1d1d">
    <rect x="453" y="545" width="8" height="7"/><rect x="480" y="545" width="8" height="7"/>
    <rect x="507" y="545" width="8" height="7"/><rect x="534" y="545" width="8" height="7"/>
    <rect x="561" y="545" width="8" height="7"/><rect x="588" y="545" width="8" height="7"/>
    <rect x="615" y="545" width="8" height="7"/><rect x="642" y="545" width="8" height="7"/>
  </g>
  <!-- labels -->
  <rect x="215" y="355" width="130" height="40" fill="#fff" opacity="0.92"/>
  <text x="280" y="383" font-size="24" font-weight="700" fill="#222" text-anchor="middle">CORPO</text>
  <rect x="497" y="680" width="100" height="40" fill="#fff" opacity="0.92"/>
  <text x="547" y="708" font-size="24" font-weight="700" fill="#222" text-anchor="middle">ALA</text>
  <text x="690" y="230" font-size="15" fill="#555">paredes</text>
  <text x="690" y="250" font-size="15" fill="#555">(cinzento)</text>
  <text x="690" y="300" font-size="15" fill="#8a5a22">vigas do teto</text>
  <text x="690" y="320" font-size="15" fill="#8a5a22">22×7,5 a cada</text>
  <text x="690" y="340" font-size="15" fill="#8a5a22">≤ 1,00 m (castanho)</text>
  <!-- section line A -->
  <line x1="547.5" y1="180" x2="547.5" y2="850" stroke="#1565c0" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="556" y="190" font-size="20" font-weight="700" fill="#1565c0">A</text>
  <text x="556" y="860" font-size="20" font-weight="700" fill="#1565c0">A</text>
  <!-- callout -->
  <line x1="300" y1="610" x2="450" y2="556" stroke="#222" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="130" y="630" font-size="16" fill="#222">Aqui NÃO há parede: a divisão do</text>
  <text x="130" y="650" font-size="16" fill="#222">corpo abre para a ala (é a mesma sala).</text>
  <text x="130" y="676" font-size="16" fill="#222">As vigas do corpo neste troço não têm</text>
  <text x="130" y="696" font-size="16" fill="#222">parede onde pousar a ponta.</text>
  <rect x="130" y="728" width="22" height="9" fill="#e67e00"/>
  <text x="160" y="737" font-size="16" fill="#b35f00" font-weight="700">O modelo põe uma viga lamelada</text>
  <text x="130" y="758" font-size="16" fill="#b35f00">20×10 ao longo da abertura, apoiada</text>
  <text x="130" y="778" font-size="16" fill="#b35f00">nas paredes das duas pontas.</text>
  <rect x="130" y="797" width="9" height="8" fill="#1d1d1d"/>
  <text x="148" y="805" font-size="16" fill="#222">estribo de asa externa na ponta de</text>
  <text x="130" y="825" font-size="16" fill="#222">cada viga, pregado a essa viga lamelada.</text>

  <!-- ===== 2. section A-A ===== -->
  <text x="40" y="905" font-size="20" font-weight="700" fill="#222">2. Corte A–A (de norte para sul, pelas vigas do corpo)</text>
  <!-- floor -->
  <line x1="100" y1="1180" x2="790" y2="1180" stroke="#888" stroke-width="3"/>
  <!-- walls (north of the body, south of the wing) -->
  <rect x="120" y="1062" width="12" height="118" fill="#555"/>
  <rect x="738" y="1062" width="12" height="118" fill="#555"/>
  <!-- the body's beam, north wall to the header -->
  <rect x="120" y="1048" width="352" height="14" fill="#c99a62" stroke="#8a5a22"/>
  <!-- header in section -->
  <rect x="474" y="1046" width="10" height="17" fill="#e67e00" stroke="#a35400"/>
  <!-- hanger -->
  <path d="M458,1046 L458,1064 L474,1064 L474,1046" fill="none" stroke="#1d1d1d" stroke-width="3"/>
  <!-- the wing's beams, cut -->
  <g fill="#c99a62" stroke="#8a5a22">
    <rect x="497" y="1048" width="4" height="14"/><rect x="524" y="1048" width="4" height="14"/>
    <rect x="551" y="1048" width="4" height="14"/><rect x="578" y="1048" width="4" height="14"/>
    <rect x="605" y="1048" width="4" height="14"/><rect x="632" y="1048" width="4" height="14"/>
    <rect x="659" y="1048" width="4" height="14"/><rect x="686" y="1048" width="4" height="14"/>
    <rect x="713" y="1048" width="4" height="14"/>
  </g>
  <!-- no wall under the header -->
  <line x1="479" y1="1068" x2="479" y2="1178" stroke="#c62828" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="488" y="1150" font-size="15" fill="#c62828">sem parede por baixo</text>
  <!-- false ceiling -->
  <line x1="132" y1="1072" x2="738" y2="1072" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="140" y="1094" font-size="14" fill="#777">teto falso</text>
  <!-- labels -->
  <text x="120" y="1205" font-size="15" fill="#555">parede norte do corpo</text>
  <text x="790" y="1205" font-size="15" fill="#555" text-anchor="end">parede sul da ala</text>
  <text x="140" y="1037" font-size="15" fill="#8a5a22">viga do teto do corpo (22×7,5)</text>
  <line x1="420" y1="1000" x2="470" y2="1042" stroke="#222" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="300" y="995" font-size="15" fill="#b35f00" font-weight="700">viga lamelada 20×10 (cortada)</text>
  <line x1="420" y1="1112" x2="462" y2="1068" stroke="#222" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="290" y="1128" font-size="15" fill="#222">estribo de asa externa</text>
  <text x="600" y="1037" font-size="15" fill="#8a5a22" text-anchor="middle">vigas da ala (cortadas)</text>
  <text x="300" y="1240" font-size="15" fill="#555" text-anchor="middle">← CORPO</text>
  <text x="610" y="1240" font-size="15" fill="#555" text-anchor="middle">ALA →</text>

  <!-- ===== 3. hanger detail ===== -->
  <text x="40" y="1295" font-size="20" font-weight="700" fill="#222">3. Pormenor do estribo</text>
  <!-- beam (side) -->
  <rect x="250" y="1330" width="270" height="88" fill="#d9ad78" stroke="#8a5a22" stroke-width="2"/>
  <text x="300" y="1380" font-size="16" fill="#5d3a12">viga 22×7,5 (de lado)</text>
  <!-- header (section) -->
  <rect x="520" y="1330" width="40" height="80" fill="#f0a040" stroke="#a35400" stroke-width="2"/>
  <line x1="520" y1="1330" x2="560" y2="1410" stroke="#a35400" stroke-width="1"/>
  <line x1="560" y1="1330" x2="520" y2="1410" stroke="#a35400" stroke-width="1"/>
  <!-- hanger: side plate, seat, flange on the header's face -->
  <rect x="468" y="1356" width="52" height="66" fill="#9aa3ab" fill-opacity="0.55" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="466" y1="1422" x2="522" y2="1422" stroke="#1d1d1d" stroke-width="5"/>
  <line x1="519" y1="1356" x2="519" y2="1422" stroke="#1d1d1d" stroke-width="5"/>
  <g fill="#1d1d1d"><circle cx="530" cy="1366" r="3"/><circle cx="530" cy="1384" r="3"/><circle cx="530" cy="1402" r="3"/>
    <circle cx="482" cy="1372" r="2.5"/><circle cx="500" cy="1372" r="2.5"/><circle cx="482" cy="1404" r="2.5"/><circle cx="500" cy="1404" r="2.5"/></g>
  <text x="580" y="1350" font-size="16" fill="#b35f00" font-weight="700">viga lamelada 20×10</text>
  <text x="580" y="1370" font-size="16" fill="#b35f00">(o "suporte" dos estribos)</text>
  <text x="580" y="1402" font-size="16" fill="#222">abas do estribo pregadas</text>
  <text x="580" y="1422" font-size="16" fill="#222">na face desta viga</text>
  <text x="250" y="1450" font-size="16" fill="#222">assento do estribo debaixo da ponta da viga</text>

  <rect x="40" y="1478" width="820" height="66" rx="8" fill="#fff4e0" stroke="#e67e00"/>
  <text x="56" y="1505" font-size="17" fill="#222" font-weight="700">A pergunta: os estribos precisam de uma peça onde pregar as abas.</text>
  <text x="56" y="1530" font-size="17" fill="#222">Usam uma viga como esta (laranja), ou fazem de outra forma?</text>
</svg>
