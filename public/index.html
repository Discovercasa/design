<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovercasa Design</title>
<meta name="description" content="Hub dos projetos Discovercasa: o que é cada projeto, em que fase está, o que foi feito e o que vem a seguir.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#2a2a29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Design">
<!-- tema escolhido nas Definições, antes de desenhar (evita o piscar) -->
<script>
  try {
    const t = localStorage.getItem('hub-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    if (localStorage.getItem('hub-movimento') === 'reduzido') document.documentElement.dataset.movimento = 'reduzido';
  } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/hub.css">
</head>
<body>
<a class="so-leitor" href="#vista">Saltar para o conteúdo</a>

<header class="topo" id="topo" hidden>
  <div class="topo-linha">
    <a class="marca" href="#/" aria-label="Discovercasa Design, Início" title="Voltar ao Início e atualizar"><img src="/img/icone-192.png" alt="" width="26" height="26">Discovercasa <span>Design</span></a>
    <nav class="nav" id="nav" aria-label="Projetos"></nav>
    <div class="topo-acoes">
      <button class="icone-botao" id="b-sugestoes" type="button" aria-label="Sugestões" title="Sugestões"></button>
      <button class="icone-botao" id="b-notificacoes" type="button" aria-label="Notificações" title="Notificações" aria-expanded="false" aria-controls="pop-notificacoes"></button>
      <button class="botao-perfil" id="b-perfil" type="button" aria-label="Perfil" aria-expanded="false" aria-controls="pop-perfil"><span class="avatar" id="avatar"></span></button>
    </div>
  </div>
</header>

<!-- sem sessão: entra-se com a conta do Hub -->
<section class="entrar" id="ecra-entrar" hidden>
  <div class="painel">
    <h1>Entrar no Design</h1>
    <p class="suave">O Design usa a conta do Hub. Só entra quem tem a permissão "Design".</p>
    <button class="btn primario grande" id="entrar" type="button">Entrar com a conta do Hub</button>
    <p id="entrar-msg" class="suave pequeno" role="status"></p>
  </div>
</section>

<main id="vista" tabindex="-1" hidden></main>

<div class="pop" id="pop-notificacoes" role="dialog" aria-label="Notificações" hidden></div>
<div class="pop" id="pop-perfil" role="menu" aria-label="Perfil" hidden></div>
<dialog class="dialogo" id="dlg"></dialog>
<dialog class="gaveta" id="gaveta" aria-label="Sugestões"></dialog>
<div class="avisos" id="avisos" aria-live="polite"></div>

<!-- Supabase (cliente público) e GSAP (animações; todos os plugins são gratuitos) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="/js/design-core.js"></script>
<script type="module" src="/js/hub/app.js"></script>
</body>
</html>
